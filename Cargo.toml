[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor", ".dev"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
rhein-proto = { path = "crates/rhein-proto" }
rhein-net = { path = "crates/rhein-net" }
rhein-auth = { path = "crates/rhein-auth" }
rhein-store = { path = "crates/rhein-store" }
rhein-ui = { path = "crates/rhein-ui" }
rhein-rpc = { path = "crates/rhein-rpc" }
rhein-mls = { path = "crates/rhein-mls" }
rhein-voice = { path = "crates/rhein-voice" }
rhein-update = { path = "crates/rhein-update" }

anyhow = "1"
thiserror = "2"
base64 = "0.22"
dirs = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2"
regex = "1"
unicode-segmentation = "1.12"
emojis = "0.9"
urlencoding = "2"
opaque-ke = { version = "4.0.1", features = ["argon2", "ristretto255"] }
argon2 = "0.5"
sha2 = "0.10"
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "23973bd49f282846d2d285374d8b81c4d2a36a4b" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "23973bd49f282846d2d285374d8b81c4d2a36a4b", features = ["font-kit", "wayland", "x11"] }

# Our own crates: file and line in panics and backtraces, without full debug info, which
# made every test binary hundreds of MB (libwebrtc and gpui are linked into each).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

# The UI's own crates run every frame's layout and lookups; unoptimised they made the debug
# client feel far slower than a release. Level 1 keeps rebuilds quick.
[profile.dev.package.rhein]
opt-level = 1

[profile.dev.package.rhein-ui]
opt-level = 1

[profile.dev.package.rhein-store]
opt-level = 1

# What `./install` builds and installs: the release build, optimised across crates and with
# its symbols stripped. Slower to build than `--release`, which stays quick for development.
[profile.production]
inherits = "release"
lto = "thin"
# Across all cores; one unit per crate made every rebuild a single-core crawl for a few percent.
codegen-units = 16
strip = true

# openmls with Telium's GroupInfo external_pub encoding; see vendor/openmls/RHEIN.md.
[patch.crates-io]
openmls = { path = "vendor/openmls" }
# OpenH264's decoder only, kept apart from the encoder libwebrtc links; see vendor/openh264-sys2/RHEIN.md.
openh264-sys2 = { path = "vendor/openh264-sys2" }

# libwebrtc with RtpTransceiver::set_direction for mesh calls; see vendor/libwebrtc/RHEIN.md.
# livekit and livekit-signaling with set_token, for renewing a call's join token
# mid-call; see vendor/livekit/RHEIN.md.
[patch."https://github.com/livekit/rust-sdks"]
libwebrtc = { path = "vendor/libwebrtc" }
livekit = { path = "vendor/livekit" }
livekit-signaling = { path = "vendor/livekit-signaling" }

# gpui_wgpu with colour emoji fonts allowed as the font of a run; see vendor/gpui_wgpu/RHEIN.md.
[patch."https://github.com/zed-industries/zed"]
gpui_wgpu = { path = "vendor/gpui_wgpu" }
# GPUI with views reused when a scroll only moves them; see vendor/gpui/RHEIN.md.
gpui = { path = "vendor/gpui" }
