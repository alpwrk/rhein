name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported runner, so the binary runs on any glibc from 2.35 on.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Notes
        # First, so a tag without a CHANGELOG.md section fails before the long build.
        run: mkdir -p dist && scripts/release-notes.sh "$GITHUB_REF_NAME" > dist/notes.md
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libasound2-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libglib2.0-dev libfontconfig-dev libfreetype-dev libwayland-dev
      - name: Clang 21
        # The libwebrtc that webrtc-sys downloads ships a libc++ that needs clang 21 or later;
        # Ubuntu 22.04 has clang 14.
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: ./install --build-only --no-deps
      - name: Pack
        # Signed for the in-app updater, which installs nothing without a valid signature.
        env:
          RHEIN_SIGNING_KEY: ${{ secrets.RHEIN_SIGNING_KEY }}
        run: |
          [[ -n $RHEIN_SIGNING_KEY ]] || { echo "the RHEIN_SIGNING_KEY secret is missing" >&2; exit 1; }
          scripts/package.sh "$GITHUB_REF_NAME"
      - uses: softprops/action-gh-release@v2
        with:
          name: Rhein ${{ github.ref_name }}
          make_latest: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.sig
          body_path: dist/notes.md
